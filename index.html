<style>
/* Layout: dark-teal velvet stage, invitations arrive one by one as tall "cards" in a 1–3 column feed */
:root{
  --bg:#0d2426; --bg2:#123235; --card:#163b3e; --line:#2c5457;
  --gold:#e2c48f; --turq:#68d2c4; --fg:#f3ece0; --muted:#a9c2bf;
  --f-script:"Ballet","Great Vibes",cursive;
  --f-body:"Alegreya Sans",system-ui,sans-serif;
  --f-label:"Marcellus",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(1200px 600px at 50% -200px,#1d4a4d 0,transparent 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1100px;margin:0 auto}
header{text-align:center;padding-block:44px 28px;display:grid;gap:10px;justify-items:center}
.brand{font-family:var(--f-script);font-size:clamp(56px,13vw,96px);line-height:1.1;color:var(--gold);margin:0}
.eyebrow{font-family:var(--f-label);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--turq)}
.lead{max-width:34em;color:var(--muted);margin:0;text-wrap:balance}
.count{font-family:var(--f-label);color:var(--gold);font-size:14px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 26px}
.chip{font:500 14px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.chip:focus-visible,.card:focus-visible,.ig:focus-visible{outline:2px solid var(--turq);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  animation:arrive .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
@keyframes arrive{from{transform:translateY(26px) scale(.97);opacity:.15}to{transform:none;opacity:1}}
.face{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center;padding:18px;position:relative;
  background:linear-gradient(150deg,var(--c1),var(--c2))}
.face::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.45);border-radius:12px}
.face::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.25),transparent 60%)}
.names{position:relative;z-index:1;font-family:var(--f-script);font-size:clamp(34px,8vw,42px);line-height:1.15;color:var(--ink,#fff);text-shadow:0 1px 10px rgba(0,0,0,.25);text-wrap:balance}
.num{position:absolute;top:16px;left:18px;z-index:1;font:12px var(--f-label);letter-spacing:.1em;color:var(--ink,#fff);opacity:.8}
.body{padding:14px 16px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.type{font-family:var(--f-label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--turq)}
.fx{margin:0;font-size:15px}
.meta{margin:0;color:var(--muted);font-size:13px}
.go{margin-top:6px;font:700 14px var(--f-body);color:var(--gold)}
footer{text-align:center;margin-top:44px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.ig{color:var(--gold);font-family:var(--f-label);letter-spacing:.08em;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:9px 20px}
@media (prefers-reduced-motion:reduce){.card{animation:none}.card:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">Animasiyalı rəqəmsal dəvətnamələr</span>
    <h1 class="brand">Devetify</h1>
    <p class="lead">Hazırladığımız dəvətnamələr. İstənilən kartı açın və dəvətnamənin necə açıldığını, necə hərəkətə gəldiyini öz telefonunuzda yoxlayın.</p>
    <span class="count" id="count"></span>
  </header>
  <div class="chips" id="chips" role="group" aria-label="Növə görə seç"></div>
  <main class="grid" id="grid"></main>
  <footer>
    <p>Sizin hekayəniz üçün də belə bir dəvətnamə hazırlayaq.</p>
    <a class="ig" href="https://instagram.com/devetify" target="_blank" rel="noopener">Instagram · @devetify</a>
  </footer>
</div>

<script>
const D=[
 ["Seva","Xına","Sehrli çıraq silkələnir, firuzəyi tüstü ilə dəvət açılır","24.10.2026 · Manqal, Zaqulba","https://devetiyfcom.github.io/Seva-brideparty/","#2f8f87","#c9a24a"],
 ["Söhrab & Nərminə","Toy","Zərf açılır, dəvət kartı içindən çıxır","Hollywood Şadlıq Sarayı","sohrab-nermine/","#c98a9b","#6e3550"],
 ["Söhrab & Nərminə","Toy","Ağ və açıq mavi zərif dizayn, ürək dalğalı xətt üzrə sürüşür","","sohrab-nermine-mavi/","#b9d6ea","#5d86a8"],
 ["Günay & Polad","Toy","WhatsApp söhbəti formatında dəvət","","gunay-polad/","#25a46a","#0f5c47"],
 ["Elnur & Aysel","Toy","Güllü tağ açılır, bordo-qızılı səhifələr","Movida Şadlıq Sarayı","https://devetifyaz.github.io/AyselElnur/","#7b2236","#c79a5a"],
 ["Nigar & Tural","Nişan","WhatsApp söhbəti, canlı geri sayım, təbrik qutusu","17.10.2026 · Zeytun","nigar-tural/","#e7a3a8","#7b4b63"],
 ["Sevinc & Rüstəm","Toy","Sürüşdürdükcə günəş doğur və batır, kəpənəklər uçur","Sarı Gəlin Şadlıq Sarayı","https://devetiyfcom.github.io/sevinc-ve-rustem/","#f3a64a","#5b3f8c"],
 ["Almaz & Aydın","Toy","Visteriya çiçəkləri arasından adlar açılır","11.11.2026 · Ağ Saray","https://devetiyfcom.github.io/AA/","#b6a3d8","#5f4b8b"],
 ["Samira & Fariz","Toy","Möhürlü zərf açılır, S & F monoqramı","11.11.2026 · Sapfir Şadlıq Sarayı","samira-fariz/","#2a4f86","#c9a96a"],
 ["Nərmin & Cəlal","Toy","Çiçək ürəyini barmaqla sil, tarix üzə çıxır","11.11.2026 · Buta Palace","nermin-celal/","#f2b8c6","#a35d78"],
 ["Leyli & Məcnun","Şərq nağılı","Saray pərdələri aralanır, musiqi başlayır","Min Bir Gecə Sarayı","https://devetiyfcom.github.io/leylivemecnunn/","#1f6f78","#c9a24a"],
 ["Günay & Zeynal","Toy","Möhürlü zərf, ürəkli təqvim geri sayımı","11.11.2026 · Mirvarı Şadlıq Sarayı","gunay-zeynal/","#d9b7a0","#7d5240"],
 ["Zümrüd & Orxan","Lux nümunə","Toxun-aç girişi, çəhrayı-qızılı lüks dizayn","","zumrud-orxan/","#f1cfc8","#b88a4e"],
 ["Fatimə","Ad günü","Zoluska nağılı, buz-mavi sehrli dəvət","12 yaş","fatime/","#bfe3f5","#5a8fc0"],
 ["Fəridə & Tahir","Toy","Kamera bağ qapısına yaxınlaşır, qapı açılır","11.11.2026 · Elux Events Hall","feride-tahir/","#e9d3c0","#8a6a4f"],
 ["Cavadın toyu","Oğlan toyu","“Qardaş, məclis var!” manqal səhnəsi, qonaq dəftəri","Cigər axşamı","https://devetifyaz.github.io/Cavadin-toyu/","#b4532a","#3c2416"],
 ["Elnarə & Namiq","Toy","Qarlı qış qapısı, qar dənələri yağır","11.11.2026 · Nealit Şadlıq Sarayı","elnare-namiq/","#dbe8f2","#5b7a9c"],
 ["Cəmil & Cəmilə","Toy","Mum möhür sınır, qızılı kəpənəklər uçur","10.10.2026 · Buta Şadlıq Sarayı","cemil-cemile/","#1d2b4f","#d4a373"],
 ["Firuzə & Vaqif","Toy","Qızılı örtüyü sil, tarix və saat görünür","11.11.2026 · Buta Şadlıq Sarayı","firuze-vaqif/","#8c2f3f","#d8b26e"],
 ["Anna & Farid","Toy","Toy dəvətnaməsi","","anna-farid/","#e8c9b5","#94624a"],
 ["Emilia & Adnan","1 yaş","Uçan xalça, sehrli çıraqdan cin çıxır","16.09.2026 · Zaqulba Steak House","emilia-adnan/","#5a2d82","#e0a93b"],
 ["Ziya & Səbinə","Toy","Zərf açılır, velosipedçi səhnəsi, ulduzlar düşür","25.04.2027 · Villa Bella","ziya-sebine/","#a9c8de","#7f9f84"],
 ["Murad & Könül","Toy","Gəlin maşını yazını silib adları açır","10.10.2026 · Movida Plaza","murad-konul/","#e9e2cf","#8aa48a"],
 ["Ulduz & Aslan","Toy","Toy dəvətnaməsi","","ulduz-aslan/","#1c2a4a","#e3c58a"],
 ["Elvin & Aysel","Toy","Toy dəvətnaməsi","","elvin-aysel/","#d9a5a0","#6d3b47"],
 ["Ramina","Ad günü","Tort məclisi dəvətnaməsi","","ramina/","#f7c7da","#e48aa8"]
];
const light=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+((n>>8&255)*587)+((n&255)*114))/1000>170};
const grid=document.getElementById('grid'),chips=document.getElementById('chips');
document.getElementById('count').textContent=D.length+" dəvətnamə";
function render(f){
  grid.innerHTML="";let i=0;
  D.forEach((d,k)=>{
    if(f&&d[1]!==f)return;
    const [n,t,fx,m,u,c1,c2]=d,a=document.createElement('a');
    a.className="card";a.href=u;a.target="_blank";a.rel="noopener";a.style.setProperty('--i',i++);
    a.style.setProperty('--c1',c1);a.style.setProperty('--c2',c2);
    if(light(c1)&&light(c2))a.style.setProperty('--ink','#3a2a2a');
    a.innerHTML=`<div class="face"><span class="num">${String(k+1).padStart(2,"0")}</span><div class="names"></div></div>
      <div class="body"><span class="type"></span><p class="fx"></p>${m?'<p class="meta"></p>':''}<span class="go">Açıb bax →</span></div>`;
    a.querySelector('.names').textContent=n;a.querySelector('.type').textContent=t;a.querySelector('.fx').textContent=fx;
    if(m)a.querySelector('.meta').textContent=m;
    grid.appendChild(a);
  });
}
const types=["Hamısı",...new Set(D.map(d=>d[1]))];
types.forEach((t,k)=>{const b=document.createElement('button');b.className="chip";b.id="chip"+k;b.textContent=t;
  b.setAttribute('aria-pressed',k===0);b.onclick=()=>{chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render(k?t:null)};chips.appendChild(b)});
render(null);
</script>

</body>
</html>
