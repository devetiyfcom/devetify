<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devetify Dəvətnamələr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Animasiyalı dijital dəvətnamələr: toy, nişan, xına, ad günü və təbriklər. Karta toxunun, dəvətnamə açılsın.">
<meta property="og:type" content="website">
<meta property="og:title" content="Devetify — dijital dəvətnamələr">
<meta property="og:description" content="Toy, nişan, xına, ad günü və təbriklər. Karta toxunun, dəvətnamə açılsın.">
<meta property="og:url" content="https://devetiyfcom.github.io/devetify/">
<meta property="og:image" content="https://devetiyfcom.github.io/devetify/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://devetiyfcom.github.io/devetify/preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ballet&family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: wordmark masthead, sticky category rail, grid of phone-shaped cards that open each invitation */
:root{
  --ink:#0d2426;        /* deep teal ground */
  --ink-2:#143336;      /* raised surface */
  --line:#2a4b4c;       /* hairlines */
  --gold:#d9b46a;       /* brand accent */
  --gold-soft:#e9d3a3;
  --text:#f2ece0;       /* warm ivory text */
  --muted:#a9b9b4;
  --f-mark:"Ballet","Great Vibes",cursive;
  --f-head:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{
  margin:0;background:var(--ink);color:var(--text);
  font:16px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:44px 22px;text-align:center;display:grid;gap:10px;justify-items:center}
.mark{font:400 clamp(3.4rem,11vw,5.6rem)/1.15 var(--f-mark);color:var(--gold);margin:0;padding-top:.15em}
.tag{font:400 .8rem/1 var(--f-head);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft)}
.lead{max-width:34em;margin:6px 0 0;color:var(--muted);text-wrap:balance}
.rail{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--ink);border-bottom:1px solid var(--line);
  padding-block:12px;margin-bottom:24px;
}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:safe center;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--text);
  font:500 .95rem/1 var(--f-body);padding:10px 16px;border-radius:999px;cursor:pointer;
  display:inline-flex;gap:8px;align-items:center;transition:border-color .2s,background .2s,color .2s;
}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85em}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--ink)}
.chip:focus-visible,.card:focus-visible,.ig:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:26px 18px;padding-bottom:20px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:22px 12px}}
.card{display:grid;gap:10px;text-decoration:none;color:inherit;min-width:0}
.phone{
  position:relative;aspect-ratio:1/2;max-width:100%;border-radius:22px;overflow:hidden;
  background:var(--ink-2);border:1px solid var(--line);
  box-shadow:0 10px 30px -14px rgba(0,0,0,.7);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s;
}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phone::after{
  content:"Bax";position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);
  font:500 .8rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;
  background:var(--gold);color:var(--ink);padding:9px 16px;border-radius:999px;opacity:0;
  transition:opacity .3s,transform .3s;
}
.card:hover .phone{transform:translateY(-5px);border-color:var(--gold)}
.card:hover .phone::after{opacity:1;transform:translate(-50%,0)}
.meta{display:grid;gap:3px;padding-inline:4px;min-width:0}
.name{font:400 1.12rem/1.25 var(--f-head);overflow-wrap:anywhere}
.note{font-size:.88rem;color:var(--muted);line-height:1.35}
.kind{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.state{text-align:center;color:var(--muted);padding-block:40px}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:34px 44px;text-align:center;display:grid;gap:14px;justify-items:center}
footer p{margin:0;color:var(--muted);max-width:30em;text-wrap:balance}
footer .mark{font-size:2.6rem}
.ig{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);transition:background .2s,color .2s}
.ig:hover{background:var(--gold);color:var(--ink)}
.ig svg{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.phone,.phone::after,.chip{transition:none}.card:hover .phone{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">Dijital dəvətnamələr</span>
    <h1 class="mark">Devetify</h1>
    <p class="lead">Toy, nişan, xına, ad günü və təbriklər üçün animasiyalı dəvətnamələr. Karta toxunun, dəvətnamə telefonda necə açılırsa, elə də açılacaq.</p>
  </header>

  <nav class="rail" aria-label="Bölmələr"><div class="chips" id="chips"></div></nav>

  <main>
    <div class="grid" id="grid"></div>
    <p class="state" id="state">Dəvətnamələr yüklənir…</p>
  </main>

  <footer>
    <span class="mark">Devetify</span>
    <p>Öz dəvətnamənizi sifariş etmək üçün Instagram-da yazın.</p>
    <a class="ig" href="https://www.instagram.com/devetify?vrfl=MTlnbnp5NzNzdHkweA==" target="_blank" rel="noopener" aria-label="Devetify Instagram səhifəsi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </footer>
</div>

<script>
(function(){
  var ORDER=["Hamısı","Toy","Nişan","Xına","Sünnət toyu","Ad günü","Bayram","Təbrik"];
  var grid=document.getElementById('grid'),chips=document.getElementById('chips'),state=document.getElementById('state');
  var all=[],current="Hamısı";

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function renderChips(){
    var counts={};all.forEach(function(d){counts[d.bolme]=(counts[d.bolme]||0)+1});
    var cats=ORDER.filter(function(c){return c==="Hamısı"||counts[c]});
    Object.keys(counts).forEach(function(c){if(cats.indexOf(c)<0)cats.push(c)});
    chips.innerHTML=cats.map(function(c){
      var n=c==="Hamısı"?all.length:counts[c];
      return '<button class="chip" type="button" aria-pressed="'+(c===current)+'" data-c="'+esc(c)+'">'+esc(c)+' <b>'+n+'</b></button>';
    }).join('');
  }

  function renderGrid(){
    var list=all.filter(function(d){return current==="Hamısı"||d.bolme===current});
    grid.innerHTML=list.map(function(d){
      return '<a class="card" href="'+esc(d.link)+'" target="_blank" rel="noopener">'+
        '<div class="phone"><img src="'+esc(d.sekil)+'" alt="'+esc(d.ad)+' dəvətnaməsinin açılış ekranı" loading="lazy"></div>'+
        '<div class="meta"><span class="kind">'+esc(d.bolme)+'</span><span class="name">'+esc(d.ad)+'</span>'+
        (d.qeyd?'<span class="note">'+esc(d.qeyd)+'</span>':'')+'</div></a>';
    }).join('');
    state.hidden=list.length>0;
    if(!list.length)state.textContent="Bu bölmədə hələ dəvətnamə yoxdur.";
  }

  chips.addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    current=b.getAttribute('data-c');
    try{sessionStorage.setItem('devetify-bolme',current)}catch(_){}
    renderChips();renderGrid();
  });

  try{var saved=sessionStorage.getItem('devetify-bolme');if(saved)current=saved}catch(_){}

  fetch('devetnameler.json?v='+Date.now()).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(data){
    all=data;
    if(current!=="Hamısı"&&!all.some(function(d){return d.bolme===current}))current="Hamısı";
    renderChips();renderGrid();
  }).catch(function(){
    state.textContent="Siyahı açılmadı. devetnameler.json faylı index.html ilə eyni qovluqda olmalıdır.";
  });
})();
</script>
</body>
</html>
